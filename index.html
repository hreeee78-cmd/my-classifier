<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사내 재무·회계·인사 요청 분류기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>사내 재무·회계·인사 요청 분류기</h1>
      <p id="sub" class="sub"></p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-classify" aria-controls="panel-classify" aria-selected="true">분류</button>
      <button class="tab" role="tab" id="tab-score" aria-controls="panel-score" aria-selected="false">채점</button>
    </div>

    <p id="status" class="status" role="status" hidden></p>

    <section id="panel-classify" role="tabpanel" aria-labelledby="tab-classify">
      <p class="notice">실제 이름 · 계좌 · 주민번호는 넣지 마세요</p>
      <label for="req" class="label">요청 한 줄</label>
      <textarea id="req" rows="3" placeholder="예) 거래처 대금 오늘까지 입금해야 해요"></textarea>
      <div class="btn-row">
        <button id="btn-classify" class="btn inline" type="button">분류하기</button>
        <button id="btn-sample" class="btn inline ghost" type="button">예시 문장 넣기</button>
      </div>

      <div id="result" class="card" hidden>
        <div class="row"><span class="k">가린 문장</span><span class="v" id="r-masked"></span></div>
        <div class="row"><span class="k">칸</span><span class="v strong" id="r-cat"></span></div>
        <div class="row"><span class="k">긴급도</span><span class="v strong" id="r-urg"></span></div>
        <div class="row"><span class="k">이유</span><span class="v" id="r-reason"></span></div>
        <p id="r-src" class="src"></p>
        <p id="r-why" class="src" hidden></p>
      </div>

      <details class="legend">
        <summary>칸과 긴급도의 뜻</summary>
        <div id="legend"></div>
      </details>
    </section>

    <section id="panel-score" role="tabpanel" aria-labelledby="tab-score" hidden>
      <p class="hint">정답 파일의 문장을 판정해 맞춰 봅니다. 단추를 누를 때만 정답 파일을 엽니다.</p>
      <button id="btn-score" class="btn" type="button">규칙으로 채점</button>
      <button id="btn-ai" class="btn" type="button">AI로 채점</button>
      <p id="ai-progress" class="progress" role="status" hidden></p>

      <div id="ai-out" hidden>
        <h2>규칙 · AI 나란히</h2>
        <table class="cmp">
          <thead><tr><th scope="col">지표</th><th scope="col">규칙</th><th scope="col" id="th-ai">AI</th></tr></thead>
          <tbody id="cmp-body"></tbody>
        </table>
        <p id="ai-cond" class="cond"></p>
        <button id="btn-download" class="btn secondary" type="button">AI 채점 결과 내려받기</button>
      </div>

      <div id="score-out" hidden>
        <ul class="metrics">
          <li><span class="m-label">칸 정확도</span><span class="m-val" id="m-cat"></span></li>
          <li><span class="m-label">긴급도 정확도</span><span class="m-val" id="m-urg"></span></li>
          <li><span class="m-label">둘 다 맞은 수</span><span class="m-val" id="m-both"></span></li>
          <li class="warn"><span class="m-label" id="m-spend-label"></span><span class="m-val" id="m-spend"></span></li>
        </ul>
        <p id="conditions" class="cond"></p>
        <h2>틀린 문장 <span id="wrong-count"></span></h2>
        <ol id="wrong-list" class="wrong"></ol>
      </div>
    </section>
  </main>

  <script src="mask.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
